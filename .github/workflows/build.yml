name: Build PSP Homebrew

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with PSPDEV container
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            pspdev/pspdev:latest \
            sh -lc 'export PSPDEV=/usr/local/pspdev; export PATH="$PSPDEV/bin:$PATH"; make clean || true; make'
      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: FantasyRPG-EBOOT
          path: EBOOT.PBP
          if-no-files-found: error
          
