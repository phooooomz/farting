<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Open World</title>
<style>
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; font-family: system-ui, sans-serif; color: #eee; }
body { display: flex; align-items: center; justify-content: center; }
canvas {
  image-rendering: pixelated; image-rendering: crisp-edges;
  width: min(100vw, 133vh); height: auto; aspect-ratio: 4 / 3;
  background: #000; display: block;
}
#joy {
  position: fixed; left: 24px; bottom: 24px; width: 120px; height: 120px;
  border-radius: 50%; background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.3);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#knob {
  position: absolute; left: 50%; top: 50%; width: 50px; height: 50px;
  margin: -25px 0 0 -25px; border-radius: 50%;
  background: rgba(255,255,255,0.45); pointer-events: none;
}
#btns { position: fixed; right: 20px; bottom: 20px; display: flex; gap: 12px; }
.btn {
  width: 70px; height: 70px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.15);
  color: #fff; font-size: 13px; font-weight: bold;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.btn:active { background: rgba(255,255,255,0.35); }
#err { position: fixed; top: 8px; left: 8px; color: #f66; font-size: 13px; }
</style>
</head>
<body>
<canvas id="c" width="384" height="288"></canvas>

<div id="joy"><div id="knob"></div></div>
<div id="btns">
  <button class="btn" id="bPunch">ต่อย<br>J</button>
  <button class="btn" id="bJump">กระโดด<br>Space</button>
</div>

<script>
// =====================================================
// ค่าคงที่
// =====================================================
const W = 384, H = 288;
const T = 16;                         // ขนาดช่องแผนที่ 16 px
const MAP_W = 40, MAP_H = 30;         // ขนาดแผนที่ทดสอบ (ช่อง)
const TS_COLS = 64;                   // tileset 1024 px / 16 px
const TS_FILE = 'assets/map/spr_tileset_sunnysideworld_16px.png';

const CELL = 48;                      // ขนาดช่องใน player.png (ตัวละครเดิม)
const SPRITE_SCALE = 1;
const WALK_SPEED = 2, RUN_SPEED = 3.5, JUMP_POWER = 3.2, JOY_RUN_AT = 0.9;
const SPR_DIR = 'assets/sprites/';

const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;

// =====================================================
// โหลดไฟล์
// =====================================================
function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('โหลดรูปไม่ได้: ' + src));
    i.src = encodeURI(src);
  });
}
async function fetchJson(path) {
  const r = await fetch(encodeURI(path));
  if (!r.ok) throw new Error('โหลดไม่ได้: ' + path);
  return r.json();
}

const assets = { sheet: null, tiles: null };
let TAG = {};

// =====================================================
// แยกประเภทช่องจากภาพ tileset (หญ้า / น้ำ / ทราย)
// ใช้สีเฉลี่ยของแต่ละช่อง จึงไม่ต้องรู้พิกัดล่วงหน้า
// =====================================================
function classifyTiles(img) {
  const cv2 = document.createElement('canvas');
  cv2.width = img.width; cv2.height = img.height;
  const c2 = cv2.getContext('2d');
  c2.drawImage(img, 0, 0);
  const data = c2.getImageData(0, 0, img.width, img.height).data;
  const cls = { grass: [], water: [], sand: [] };
  const rows = img.height / T, cols = img.width / T;
  for (let ty = 0; ty < rows; ty++)
    for (let tx = 0; tx < cols; tx++) {
      let r = 0, gg = 0, b = 0, opaque = true;
      for (let y = 0; y < T; y++)
        for (let x = 0; x < T; x++) {
          const i = ((ty * T + y) * img.width + tx * T + x) * 4;
          if (data[i + 3] < 255) opaque = false;
          r += data[i]; gg += data[i + 1]; b += data[i + 2];
        }
      if (!opaque) continue;
      const n = T * T; r /= n; gg /= n; b /= n;
      const id = ty * cols + tx;
      if (gg > r + 25 && gg > b + 25) cls.grass.push(id);
      else if (b > r + 50 && b > gg + 15) cls.water.push(id);
      else if (r > 190 && gg > 170 && b < 150) cls.sand.push(id);
    }
  return cls;
}

// =====================================================
// สร้างแผนที่ทดสอบ
// =====================================================
function hash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

const MAP = { w: MAP_W, h: MAP_H, ground: [], solid: [] };

function buildMap(cls) {
  const pick = (arr, x, y, s) => arr[Math.floor(hash(x, y, s) * arr.length)];
  for (let y = 0; y < MAP_H; y++)
    for (let x = 0; x < MAP_W; x++) {
      const n = vnoise(x / 6, y / 6, 3) * 0.7 + vnoise(x / 2.5, y / 2.5, 9) * 0.3;
      const border = x < 1 || y < 1 || x >= MAP_W - 1 || y >= MAP_H - 1;
      let kind = 'grass';
      if (border || n < 0.32) kind = 'water';
      else if (n < 0.37) kind = 'sand';
      const list = cls[kind].length ? cls[kind] : cls.grass;
      const i = y * MAP_W + x;
      MAP.ground[i] = pick(list, x, y, 1);
      MAP.solid[i] = kind === 'water' || border;
    }
}

function drawTileId(id, dx, dy) {
  const sx = (id % TS_COLS) * T, sy = Math.floor(id / TS_COLS) * T;
  g.drawImage(assets.tiles, sx, sy, T, T, dx, dy, T, T);
}

function drawMap(camX, camY) {
  const t0x = Math.floor(camX / T), t0y = Math.floor(camY / T);
  for (let ty = t0y; ty <= t0y + H / T + 1; ty++)
    for (let tx = t0x; tx <= t0x + W / T + 1; tx++) {
      if (tx < 0 || ty < 0 || tx >= MAP.w || ty >= MAP.h) continue;
      drawTileId(MAP.ground[ty * MAP.w + tx], tx * T - camX, ty * T - camY);
    }
}

function isSolid(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= MAP.w || ty >= MAP.h) return true;
  return MAP.solid[ty * MAP.w + tx];
}

function blocked(x, y) {
  const x0 = Math.floor((x + 1) / T), x1 = Math.floor((x + 6) / T);
  const y0 = Math.floor((y + 6) / T), y1 = Math.floor((y + 9) / T);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (isSolid(tx, ty)) return true;
  return false;
}

function spawnTile() {
  const cx = Math.floor(MAP.w / 2), cy = Math.floor(MAP.h / 2);
  for (let r = 0; r < 20; r++)
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++)
        if (!isSolid(cx + dx, cy + dy)) return { x: (cx + dx) * T, y: (cy + dy) * T };
  return { x: T, y: T };
}

// =====================================================
// ผู้เล่น
// =====================================================
let px = 0, py = 0, dir = 'd', moving = false, running = false;
let z = 0, vz = 0;
let punchCD = 0;
let override = null;

function movePlayer(dx, dy) {
  if (!blocked(px + dx, py)) px += dx;
  if (!blocked(px, py + dy)) py += dy;
}
function jump() { if (z === 0 && vz === 0) vz = JUMP_POWER; }
function punch() {
  if (punchCD > 0) return;
  punchCD = 20;
  override = { name: 'Punch', until: Date.now() + 280 };
}

function currentTagName(now) {
  let base = 'Idle';
  if (z > 0 || vz !== 0) base = 'Jump';
  else if (moving) base = running ? 'Run' : 'Walk';
  if (override && now < override.until) base = override.name;
  else override = null;
  const view = { w: 'Up', s: 'Down', a: 'Side', d: 'Side' }[dir];
  return `${base}_${view}`;
}
let curTag = '', animStart = 0;
function playerFrame(tagName, now) {
  if (tagName !== curTag) { curTag = tagName; animStart = now; }
  const tag = TAG[tagName];
  if (!tag) return null;
  const total = tag.durations.reduce((a, b) => a + b, 0);
  let ms = (now - animStart) % total, i = 0;
  while (ms >= tag.durations[i]) { ms -= tag.durations[i]; i++; }
  return { tag, frame: i };
}
function drawPlayer(bx, by, now) {
  const f = playerFrame(currentTagName(now), now);
  if (!f) return;
  const S = SPRITE_SCALE, size = CELL * S;
  const dx = bx + 4 - 25 * S, dy = by + 10 - 47 * S - Math.round(z);
  const sx = f.frame * CELL, sy = f.tag.row * CELL;
  g.save();
  if (dir === 'a') {
    g.translate(dx + size, 0); g.scale(-1, 1);
    g.drawImage(assets.sheet, sx, sy, CELL, CELL, 0, dy, size, size);
  } else {
    g.drawImage(assets.sheet, sx, sy, CELL, CELL, dx, dy, size, size);
  }
  g.restore();
}

// =====================================================
// อินพุต: คีย์บอร์ด
// =====================================================
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  if (!e.repeat) {
    if (k === ' ') jump();
    if (k === 'j') punch();
  }
  keys[k] = true;
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// =====================================================
// อินพุต: จอยเสมือนและปุ่มสัมผัส
// =====================================================
const joyEl = document.getElementById('joy');
const knob = document.getElementById('knob');
const joy = { x: 0, y: 0, run: false };
const JOY_R = 60;
let joyId = null, joyCX = 0, joyCY = 0;

function joyMove(e) {
  if (e.pointerId !== joyId) return;
  let vx = e.clientX - joyCX, vy = e.clientY - joyCY;
  const d = Math.hypot(vx, vy);
  if (d > JOY_R) { vx *= JOY_R / d; vy *= JOY_R / d; }
  knob.style.transform = `translate(${vx}px, ${vy}px)`;
  joy.x = vx / JOY_R; joy.y = vy / JOY_R;
  joy.run = d > JOY_R * JOY_RUN_AT;
}
function joyEnd(e) {
  if (e.pointerId !== joyId) return;
  joyId = null;
  knob.style.transform = 'translate(0px, 0px)';
  joy.x = 0; joy.y = 0; joy.run = false;
}
joyEl.addEventListener('pointerdown', e => {
  joyId = e.pointerId;
  joyEl.setPointerCapture(e.pointerId);
  const r = joyEl.getBoundingClientRect();
  joyCX = r.left + r.width / 2; joyCY = r.top + r.height / 2;
  joyMove(e);
});
joyEl.addEventListener('pointermove', joyMove);
joyEl.addEventListener('pointerup', joyEnd);
joyEl.addEventListener('pointercancel', joyEnd);

function bind(id, fn) {
  document.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); fn(); });
}
bind('bJump', jump);
bind('bPunch', punch);

// =====================================================
// อินพุต: Gamepad
// เดิน: D-pad/สติ๊กซ้าย, A=กระโดด, X=ต่อย, LB/RB=วิ่ง
// =====================================================
const DEADZONE = 0.2;
const gpPrev = {};
function readGamepad() {
  const out = { x: 0, y: 0, run: false, press: {} };
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue;
    let ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    if (Math.hypot(ax, ay) < DEADZONE) { ax = 0; ay = 0; }
    out.x += ax; out.y += ay;
    const b = p.buttons;
    if (b[12]?.pressed) out.y -= 1;
    if (b[13]?.pressed) out.y += 1;
    if (b[14]?.pressed) out.x -= 1;
    if (b[15]?.pressed) out.x += 1;
    if (b[4]?.pressed || b[5]?.pressed) out.run = true;
    for (const i of [0, 2]) {
      const now = !!b[i]?.pressed;
      if (now && !gpPrev[i]) out.press[i] = true;
      gpPrev[i] = now;
    }
  }
  return out;
}

// =====================================================
// อัปเดตและวาด
// =====================================================
const clamp1 = v => Math.max(-1, Math.min(1, v));
function update(now) {
  const kx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  const ky = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  const gp = readGamepad();

  if (gp.press[0]) jump();
  if (gp.press[2]) punch();

  let dx = clamp1(kx + joy.x + gp.x);
  let dy = clamp1(ky + joy.y + gp.y);
  const mag = Math.min(1, Math.hypot(dx, dy));
  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }

  running = !!(keys.shift || joy.run || gp.run);
  const speed = (running ? RUN_SPEED : WALK_SPEED) * mag;
  moving = mag > 0.05;
  if (moving) {
    if (Math.abs(dx) >= Math.abs(dy)) dir = dx < 0 ? 'a' : 'd';
    else dir = dy < 0 ? 'w' : 's';
  }
  movePlayer(dx * speed, dy * speed);

  if (z > 0 || vz !== 0) {
    z += vz; vz -= 0.3;
    if (z <= 0) { z = 0; vz = 0; }
  }
  if (punchCD > 0) punchCD--;
}

function render(now) {
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const camX = Math.round(px + 4 - W / 2), camY = Math.round(py + 5 - H / 2);
  drawMap(camX, camY);
  drawPlayer(Math.round(px) - camX, Math.round(py) - camY, now);
}

function loop() {
  const now = Date.now();
  update(now);
  render(now);
  requestAnimationFrame(loop);
}

// =====================================================
// เริ่มเกม
// =====================================================
async function start() {
  const [tiles, sheet, meta] = await Promise.all([
    loadImg(TS_FILE),
    loadImg(SPR_DIR + 'player.png'),
    fetchJson(SPR_DIR + 'player.json'),
  ]);
  assets.tiles = tiles;
  assets.sheet = sheet;
  TAG = Object.fromEntries(meta.tags.map(t => [t.name, t]));

  const cls = classifyTiles(tiles);
  if (!cls.grass.length) throw new Error('หาช่องหญ้าใน tileset ไม่เจอ');
  buildMap(cls);

  const s = spawnTile();
  px = s.x; py = s.y;
  requestAnimationFrame(loop);
}

start().catch(e => {
  document.body.insertAdjacentHTML('beforeend', `<p id="err">เริ่มเกมไม่ได้: ${e.message}</p>`);
  console.error(e);
});
</script>
</body>
</html>
