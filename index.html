<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Web MMORPG</title>
    <script src="https://socket.io"></script>
    <style>
        body { margin: 0; background: #1e272e; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; touch-action: manipulation; }
        #ui-bar { width: 100%; max-width: 960px; background: #2f3640; padding: 10px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font-size: 14px; }
        canvas { background: #4cd137; border: 3px solid #dcdde1; max-width: 100%; height: auto; }
        .panel { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        button { background: #0097e6; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:active { transform: scale(0.95); }
        .btn-action { background: #e84118; font-size: 16px; padding: 12px 20px; }
        #mobile-controls { display: flex; gap: 20px; margin-top: 10px; align-items: center; }
        .dpad { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; }
        .dpad button { height: 50px; font-size: 18px; background: #718093; }
    </style>
</head>
<body>

<div id="ui-bar">
    <div id="stats">กำลังเชื่อมต่อเซิร์ฟเวอร์...</div>
    <div class="panel">
        <button onclick="craft('stone_sword')">🔨 ดาบหิน (ไม้3 หิน2)</button>
        <button onclick="craft('iron_sword')">⚔️ ดาบเหล็ก (เหล็ก3 ไม้2)</button>
        <button onclick="craft('grilled_fish')">🐟 กินปลาย่าง (+25 EXP)</button>
        <button style="background:#8c7ae6;" onclick="enterDungeon()">🚪 วาร์ปลงดันเจี้ยน</button>
    </div>
</div>

<canvas id="game" width="960" height="560"></canvas>

<!-- ปุ่มบังคับสำหรับมือถือ (คอมใช้ปุ่ม WASD / ลูกศร และ Spacebar ได้เลย) -->
<div id="mobile-controls">
    <div class="dpad">
        <div></div><button ontouchstart="move(0,-25)" onclick="move(0,-25)">▲</button><div></div>
        <button ontouchstart="move(-25,0)" onclick="move(-25,0)">◀</button>
        <button ontouchstart="move(0,25)" onclick="move(0,25)">▼</button>
        <button ontouchstart="move(25,0)" onclick="move(25,0)">▶</button>
    </div>
    <button class="btn-action" ontouchstart="action()" onclick="action()">🪓 ฟัน / ขุด / ตกปลา / ตีมอน (Space)</button>
</div>

<script>
    // 🔴 หากเปิดออนไลน์ผ่าน Cloudflare Tunnel ให้เปลี่ยนลิงก์ด้านล่างนี้เป็นลิงก์ https://...trycloudflare.com ของคุณ
    const SERVER_URL = "http://localhost:3000"; 
    const socket = io(SERVER_URL);

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let myId = null;
    let players = {};
    let worldObjects = [];

    const icons = { tree: '🌲', rock: '🪨', ore: '💎', fish: '💧', mob: '👾', boss: '👹' };

    socket.on('init', (data) => {
        myId = data.id;
        players = data.players;
        worldObjects = data.worldObjects;
        updateUI();
    });

    socket.on('playerJoined', (p) => { players[p.id] = p; });
    socket.on('playerMoved', (data) => { if (players[data.id]) { players[data.id].x = data.x; players[data.id].y = data.y; } });
    socket.on('playerLeft', (id) => { delete players[id]; });
    socket.on('updateSelf', (p) => { players[myId] = p; updateUI(); });
    socket.on('updateObject', (obj) => {
        const idx = worldObjects.findIndex(o => o.id === obj.id);
        if (idx !== -1) worldObjects[idx] = obj;
    });
    socket.on('msg', (text) => alert(text));

    function updateUI() {
        const p = players[myId];
        if (!p) return;
        document.getElementById('stats').innerHTML = 
            `<b>Lv.${p.lv}</b> (EXP: ${p.exp}/${p.maxExp}) | ⚔️ ATK: ${p.atk} | 🪵 ไม้:${p.inv.wood} 🪨 หิน:${p.inv.stone} ⛓️ แร่:${p.inv.iron} 🐟 ปลา:${p.inv.fish}`;
    }

    function move(dx, dy) {
        const p = players[myId];
        if (!p) return;
        p.x = Math.max(20, Math.min(940, p.x + dx));
        p.y = Math.max(20, Math.min(540, p.y + dy));
        socket.emit('move', { x: p.x, y: p.y });
    }

    function action() {
        const p = players[myId];
        if (!p) return;
        // หาเป้าหมายที่อยู่ใกล้ตัวละครที่สุด
        for (let obj of worldObjects) {
            if (obj.hp > 0 && Math.hypot(p.x - obj.x, p.y - obj.y) <= 90) {
                socket.emit('interact', obj.id);
                break;
            }
        }
    }

    function craft(recipe) { socket.emit('craft', recipe); }

    function enterDungeon() {
        const p = players[myId];
        if (!p) return;
        p.x = 780; p.y = 480;
        socket.emit('move', { x: p.x, y: p.y });
    }

    // รองรับคีย์บอร์ดบนคอมพิวเตอร์
    window.addEventListener('keydown', (e) => {
        if (e.key === 'w' || e.key === 'ArrowUp') move(0, -20);
        if (e.key === 's' || e.key === 'ArrowDown') move(0, 20);
        if (e.key === 'a' || e.key === 'ArrowLeft') move(-20, 0);
        if (e.key === 'd' || e.key === 'ArrowRight') move(20, 0);
        if (e.key === ' ') action();
    });

    // วาดภาพเกม 60 FPS
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // วาดพื้นโซนดันเจี้ยนมุมขวาล่าง
        ctx.fillStyle = '#353b48';
        ctx.fillRect(720, 380, 240, 180);
        ctx.fillStyle = '#fbc531';
        ctx.font = '14px sans-serif';
        ctx.fillText('⚠️ โซนดันเจี้ยนบอส', 780, 405);

        // วาดต้นไม้ หิน แร่ บ่อปลา มอนสเตอร์
        ctx.font = '32px sans-serif';
        ctx.textAlign = 'center';
        for (let obj of worldObjects) {
            if (obj.hp <= 0) continue;
            ctx.fillText(icons[obj.type], obj.x, obj.y);
            ctx.font = '12px sans-serif';
            ctx.fillStyle = 'white';
            ctx.fillText(`${obj.name} (${obj.hp}/${obj.maxHp})`, obj.x, obj.y + 18);
            ctx.font = '32px sans-serif';
        }

        // วาดตัวละครผู้เล่นทุกคน
        for (let id in players) {
            const p = players[id];
            ctx.fillText(id === myId ? '🧙‍♂️' : '🧝', p.x, p.y);
            ctx.font = '12px sans-serif';
            ctx.fillStyle = id === myId ? '#fbc531' : '#ffffff';
            ctx.fillText(`${p.name} (Lv.${p.lv})`, p.x, p.y - 25);
            ctx.font = '32px sans-serif';
        }

        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
